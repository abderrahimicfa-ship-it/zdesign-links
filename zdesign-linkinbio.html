<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ZDESIGN — Abderrahim</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300&family=Jost:wght@200;300;400&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --terra:   #b85c38;
    --terra2:  #c97a52;
    --sage:    #6b7b5e;
    --sage2:   #8a9c7a;
    --sand:    #d4c5a9;
    --sand2:   #e8dcc8;
    --dark:    #13100d;
    --dark2:   #1c1712;
    --dark3:   #252018;
    --muted:   #6a5f52;
    --text:    #e0d5c5;
  }

  html, body {
    min-height: 100%;
    background: var(--dark);
    color: var(--text);
    font-family: 'Jost', sans-serif;
  }

  /* Subtle texture overlay */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background:
      radial-gradient(ellipse 80% 60% at 20% 0%, rgba(184,92,56,0.07) 0%, transparent 60%),
      radial-gradient(ellipse 60% 50% at 80% 100%, rgba(107,123,94,0.06) 0%, transparent 60%);
    pointer-events: none;
    z-index: 0;
  }

  /* Top accent line */
  body::after {
    content: '';
    position: fixed;
    top: 0; left: 0; right: 0;
    height: 2px;
    background: linear-gradient(90deg, transparent 0%, var(--terra) 35%, var(--sage) 65%, transparent 100%);
    z-index: 10;
  }

  .container {
    position: relative;
    z-index: 1;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 70px 24px 60px;
  }

  /* Monogram */
  .monogram {
    width: 72px;
    height: 72px;
    border: 1px solid rgba(184,92,56,0.3);
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 28px;
    position: relative;
    opacity: 0;
    animation: fadeUp 0.9s cubic-bezier(.16,1,.3,1) forwards 0.1s;
  }

  .monogram::before {
    content: '';
    position: absolute;
    inset: 4px;
    border: 1px solid rgba(107,123,94,0.2);
  }

  .monogram span {
    font-family: 'Cormorant Garamond', serif;
    font-size: 2rem;
    font-weight: 300;
    color: var(--terra2);
    letter-spacing: 0.05em;
  }

  /* Brand name */
  .brand-name {
    font-family: 'Cormorant Garamond', serif;
    font-size: clamp(2.6rem, 9vw, 4rem);
    font-weight: 300;
    letter-spacing: 0.3em;
    color: var(--sand2);
    text-transform: uppercase;
    line-height: 1;
    opacity: 0;
    animation: fadeUp 0.9s cubic-bezier(.16,1,.3,1) forwards 0.2s;
  }

  .brand-sub {
    margin-top: 10px;
    font-size: 0.6rem;
    letter-spacing: 0.45em;
    text-transform: uppercase;
    color: var(--muted);
    font-weight: 300;
    opacity: 0;
    animation: fadeUp 0.9s cubic-bezier(.16,1,.3,1) forwards 0.32s;
  }

  /* Divider */
  .divider {
    display: flex;
    align-items: center;
    gap: 12px;
    margin: 36px 0;
    opacity: 0;
    animation: fadeUp 0.9s cubic-bezier(.16,1,.3,1) forwards 0.42s;
  }

  .divider::before, .divider::after {
    content: '';
    width: 32px;
    height: 1px;
    background: var(--muted);
    opacity: 0.4;
  }

  .divider-dot {
    width: 4px;
    height: 4px;
    background: var(--terra);
    border-radius: 50%;
  }

  /* Links */
  .links {
    display: flex;
    flex-direction: column;
    gap: 12px;
    width: 100%;
    max-width: 360px;
  }

  .link-btn {
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 17px 22px;
    background: var(--dark2);
    border: 1px solid rgba(212,197,169,0.08);
    text-decoration: none;
    color: var(--text);
    font-family: 'Jost', sans-serif;
    font-size: 0.68rem;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    font-weight: 300;
    position: relative;
    overflow: hidden;
    transition: all 0.35s ease;
    opacity: 0;
  }

  .link-btn::after {
    content: '';
    position: absolute;
    left: 0; top: 0; bottom: 0;
    width: 3px;
    transform: scaleY(0);
    transform-origin: bottom;
    transition: transform 0.35s ease;
  }

  .link-btn.terra::after  { background: var(--terra); }
  .link-btn.sage::after   { background: var(--sage2); }
  .link-btn.sand::after   { background: var(--sand); }
  .link-btn.terra2::after { background: var(--terra2); }

  .link-btn:hover {
    border-color: rgba(212,197,169,0.2);
    background: var(--dark3);
    color: var(--sand2);
    transform: translateX(3px);
  }

  .link-btn:hover::after { transform: scaleY(1); }

  .link-btn:nth-child(1) { animation: fadeUp 0.7s cubic-bezier(.16,1,.3,1) forwards 0.52s; }
  .link-btn:nth-child(2) { animation: fadeUp 0.7s cubic-bezier(.16,1,.3,1) forwards 0.62s; }
  .link-btn:nth-child(3) { animation: fadeUp 0.7s cubic-bezier(.16,1,.3,1) forwards 0.72s; }
  .link-btn:nth-child(4) { animation: fadeUp 0.7s cubic-bezier(.16,1,.3,1) forwards 0.82s; }

  .link-icon {
    width: 16px;
    height: 16px;
    flex-shrink: 0;
    opacity: 0.5;
    transition: opacity 0.3s;
  }
  .link-btn:hover .link-icon { opacity: 0.9; }

  .link-label { flex: 1; }

  .link-arrow {
    font-size: 0.75rem;
    opacity: 0.25;
    transition: opacity 0.3s, transform 0.3s;
  }
  .link-btn:hover .link-arrow { opacity: 0.7; transform: translateX(4px); }

  /* Footer */
  .footer {
    margin-top: 52px;
    text-align: center;
    opacity: 0;
    animation: fadeUp 0.7s ease forwards 1s;
  }

  .footer p {
    font-size: 0.55rem;
    letter-spacing: 0.35em;
    text-transform: uppercase;
    color: var(--muted);
  }

  .footer .location {
    margin-top: 6px;
    font-family: 'Cormorant Garamond', serif;
    font-size: 0.75rem;
    font-style: italic;
    color: rgba(212,197,169,0.3);
    letter-spacing: 0.1em;
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(18px); }
    to   { opacity: 1; transform: translateY(0); }
  }
</style>
</head>
<body>

  <div class="monogram"><span>Z</span></div>

  <p class="brand-sub">Infographie 3D &nbsp;·&nbsp; ArchViz &nbsp;·&nbsp; Meknès</p>

  <div class="divider">

    <div class="divider-dot" style="background:var(--sage)"></div>

  </div>

  <div class="links">

    <!-- Portfolio -->
    <a href="https://portfolio-qi952mx3c-zdesign-s-projects.vercel.app/" target="_blank" class="link-btn terra">

        <rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/>
        <rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/>

    <a href="https://instagram.com/zdesign_archviz" target="_blank" class="link-btn sage">

    <a href="https://wa.me/212706380067" target="_blank" class="link-btn sand">
      <svg class="link-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
        <path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/>

        <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/>

  </div>

  <div class="footer">
    <p>Abderrahim Dadi — Freelance</p>

  </div>

</div>
</body>
</html>
